<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Learning Tracker{% endblock %}</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
    header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: #1e3a8a; color: #fff; }
    header .brand { font-weight: 700; font-size: 18px; margin-right: auto; }
    header form { margin: 0; }
    main { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e0e4ea; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    label { display: block; margin: 10px 0 4px; font-size: 14px; font-weight: 600; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c4cad4; border-radius: 6px; font: inherit; }
    button { padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #64748b; }
    button.danger { background: #dc2626; padding: 4px 10px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e6e9ef; vertical-align: top; }
    .flash { background: #fff7e0; border: 1px solid #f0d58a; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
    .muted { color: #64748b; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Learning Tracker</span>
    {% if current_user.is_authenticated %}
      <span>{{ current_user.username }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        <button type="submit" class="secondary">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
