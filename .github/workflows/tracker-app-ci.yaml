name: tracker-app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ushamadhurikonda/tracker-app
          flavor: latest=false
          tags: |
            type=sha,prefix=
            type=semver,pattern=v{{version}}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tracker-infra
        uses: actions/checkout@v7
        with:
          repository: usha-madhuri-konda/tracker-infra
          token: ${{ secrets.TRACKER_INFRA_TOKEN }}

      - name: Point the chart at the new image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sed -i "s/^  tag: .*/  tag: ${TAG}/" helm/tracker-chart/values.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG#v}\"/" helm/tracker-chart/Chart.yaml
          git diff --stat
          test -n "$(git status --porcelain)"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ secrets.TRACKER_INFRA_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          branch="bump/tracker-app-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add helm/tracker-chart/values.yaml helm/tracker-chart/Chart.yaml
          git commit -m "chore(helm): run tracker-app ${TAG}"
          git push origin "$branch"
          gh pr create \
            --title "chore(helm): run tracker-app ${TAG}" \
            --body "Image tag set by the release workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merging this pull request approves the release."
