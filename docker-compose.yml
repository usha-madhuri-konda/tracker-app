services:
  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    networks:
      - tracker-net

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tracker-db-data:/var/lib/postgresql/data
    networks:
      - tracker-net

networks:
  tracker-net:

volumes:
  tracker-db-data: